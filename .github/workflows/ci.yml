name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install lint tools
        run: pip install flake8==7.4.1 black==26.10.1
      - name: flake8
        run: flake8 .
      - name: black --check
        run: black --check .

  test:
    name: Test (PostgreSQL, coverage >= 80%)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticketing
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing -d ticketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
      # pytest-django creates and destroys a throwaway `test_ticketing`
      # database on the service container for every run.
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ci
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: halcyon-ticketing:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the built image with docker compose
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          curl --fail --silent --show-error http://localhost:8000/health/
          docker compose down --volumes
      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs
      # Publishing only happens on main, and only when DockerHub secrets exist
      # (DOCKERHUB_USERNAME and DOCKERHUB_TOKEN under repo Settings > Secrets).
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/halcyon-ticketing:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/halcyon-ticketing:${{ github.sha }}
          cache-from: type=gha
